<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Посещения сайта</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101312; color: #f4f5f2; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 420px); padding: 32px; border: 1px solid #343a36; border-radius: 20px; background: #191d1a; }
    p { color: #aeb7b0; line-height: 1.5; }
    .number { margin: 18px 0; font-size: clamp(56px, 16vw, 88px); line-height: 1; font-weight: 650; letter-spacing: -0.06em; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; background: #d8ff68; color: #171a14; font: inherit; font-weight: 600; cursor: pointer; }
    small { display: block; margin-top: 20px; color: #87918a; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <p>GOULASH / СТАТИСТИКА</p>
    <h1>Посещения за сегодня</h1>
    <div class="number" id="count" aria-live="polite">—</div>
    <p id="status">Загружаю счётчик…</p>
    <button id="refresh" type="button">Обновить</button>
    <small>Счётчик обновляется ежедневно по UTC. Открытия считаются максимум один раз за сессию браузера в течение дня. Это не точное число уникальных людей: боты могут учитываться, а блокировщики — мешать подсчёту.</small>
  </main>
  <script>
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");
    const day = new Date().toISOString().slice(0, 10);
    async function loadCount() {
      countEl.textContent = "—";
      statusEl.textContent = "Загружаю счётчик…";
      try {
        const response = await fetch("https://abacus.jasoncameron.dev/get/yulya9-goulash/landing-visits-" + day, { cache: "no-store" });
        if (response.status === 404) {
          countEl.textContent = "0";
          statusEl.textContent = "Пока нет зафиксированных открытий.";
          return;
        }
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        if (!Number.isFinite(data.value)) throw new Error("Invalid response");
        countEl.textContent = data.value.toLocaleString("ru-RU");
        statusEl.textContent = "Зафиксированные открытия за ${day}.";
      } catch (error) {
        countEl.textContent = "—";
        statusEl.textContent = "Не удалось получить данные. Попробуй обновить позже.";
      }
    }
    document.getElementById("refresh").addEventListener("click", loadCount);
    loadCount();
  </script>
</body>
</html>
